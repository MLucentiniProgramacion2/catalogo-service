# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  application:
    name: catalogoService
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson:
    datatype:
      datetime:
        write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: catalogo-service-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: catalogo-service-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  mail:
    from: catalogoService@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # Solo para tests: clave falsa, pública a propósito (es la jwtSecretKey de .yo-rc.json).
        # Nunca usarla en dev ni en prod; ahí la clave sale de JWT_BASE64_SECRET.
        base64-secret: Y2F0YWxvZ28tc2VydmljZTogY2xhdmUgSldUIFNPTE8gUEFSQSBURVNUUy4gTm8gdXNhciBlbiBkZXYgbmkgZW4gcHJvZC4gUHVibGljYSBhIHByb3Bvc2l0by4=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

catedra:
  api:
    # Solo para tests: valores falsos. Nadie escucha en el puerto 1, así que ningún test de
    # contexto llega a la cátedra real; los tests del cliente usan un servidor simulado.
    url: http://localhost:1
    token: token-falso-solo-para-tests

sync:
  retry:
    # Esperas cortas para que ningún test de integración duerma 7 s. Las de verdad (1 s, 2 s y 4 s)
    # las verifican los unitarios del caso de uso, sin dormir.
    delays: 10ms,20ms,40ms

application:
  liquibase:
    # Igual que en el application.yml principal, que este archivo tapa en los tests: Liquibase
    # termina antes de que Hibernate valide el esquema, sin depender del nombre del perfil.
    async-start: false
management:
  health:
    mail:
      enabled: false
